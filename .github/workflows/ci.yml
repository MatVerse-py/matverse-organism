name: ci

on:
  push:
    branches: [main, release/**]
  pull_request:
    branches: [main, release/**]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Compile
        run: python -m compileall -q matverse/ tests/

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: CLI smoke
        run: |
          python -m matverse --version
          python -m matverse atlas health
          python -m matverse thermo report
          python -m matverse captals report
          python -m matverse existential status

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m compileall -q matverse/ tests/
      - name: Bytecode stats
        run: |
          python -c "import matverse; print('exports:', len(matverse.__all__))"
