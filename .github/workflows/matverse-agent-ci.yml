name: MatVerse Agent CI

on:
  pull_request:
    paths:
      - "agent/**"
      - ".github/workflows/matverse-agent-ci.yml"
  push:
    branches:
      - "agent/matverse-agent-free-v1"
    paths:
      - "agent/**"
      - ".github/workflows/matverse-agent-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: agent/pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Test
        run: pytest --cov=matverse_agent --cov-report=term-missing
      - name: Package
        run: python -m pip wheel . --no-deps --wheel-dir dist
