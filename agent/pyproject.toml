[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "matverse-agent-local"
version = "1.0.0"
description = "Local-first autonomous agent with governed tools, MCP, memory and artifact generation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "MatVerse" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "mcp>=1.27,<2",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
artifacts = [
  "Pillow>=10.4,<12",
  "python-pptx>=1.0,<2",
]
browser = [
  "playwright>=1.49,<2",
]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
matverse-agent = "matverse_agent.cli:main"
matverse-agent-mcp = "matverse_agent.mcp_server:main"
matverse-agent-web = "matverse_agent.web:main"
matverse-connectors = "matverse_agent.connector_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/matverse_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/matverse_agent/tools.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["matverse_agent"]
branch = true
