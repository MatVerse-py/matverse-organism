<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Helvetica, Arial, sans-serif">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
        </marker>
        <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
          <line x1="0" y1="0" x2="0" y2="6" stroke="#bbb" stroke-width="1"/>
        </pattern>
      </defs>
      <rect width="800" height="500" fill="#ffffff"/>
      <text x="20" y="30" font-size="14" font-weight="600" fill="#1a1a1a">Diagrama de corpo livre · plano inclinado a 30°</text>
      <text x="20" y="48" font-size="10" fill="#666">FREE_BODY_DIAGRAM · SVG · 30°</text>

      <!-- incline -->
      <path d="M 160 320 L 680 158.34192462690478 L 680 320 Z" fill="url(#hatch)" stroke="#666" stroke-width="1"/>
      <line x1="160" y1="320" x2="680" y2="158.34192462690478"
            stroke="#666" stroke-width="1.5"/>
      <!-- block -->
      <g transform="translate(310 135.35898384862247) rotate(-30 90 45)">
        <rect width="180" height="90" fill="#cfe2ff" stroke="#1a1a1a" stroke-width="1.5" rx="4"/>
        <text x="90" y="50" text-anchor="middle" font-size="14" fill="#1a1a1a">m</text>
      </g>
      <!-- vectors from block center -->
      <g transform="translate(400 180.35898384862247)">
        <!-- weight mg (down) -->
        <line x1="0" y1="0" x2="0" y2="100" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)"/>
        <text x="6" y="105" font-size="12" fill="#1a1a1a">mg</text>
        <!-- normal N (perpendicular to plane, away from plane) -->
        <line x1="0" y1="0" x2="-49.99999999999999" y2="-86.60254037844388" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)"/>
        <text x="-71" y="-90.60254037844388" font-size="12" fill="#1a1a1a">N</text>
        <!-- friction f (up the plane, opposes motion) -->
        <line x1="0" y1="0" x2="103.92304845413264" y2="-59.99999999999999" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)"/>
        <text x="108.25317547305484" y="-63.99999999999999" font-size="12" fill="#1a1a1a">f</text>
      </g>
      <!-- angle marker -->
      <path d="M 220 320 A 60 60 0 0 0 211.96152422706632 290"
            fill="none" stroke="#1a1a1a" stroke-width="1"/>
      <text x="230" y="310" font-size="12" fill="#1a1a1a">30°</text>
    </svg>