[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matverse-organism"
version = "3.7.0"
description = "A hypothesis field + metabolic runtime + metacortex for auditable problem engineering"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "MatVerse Builder", email = "builder@matverse.local"},
]
requires-python = ">=3.8"
keywords = [
    "hypothesis", "decision-intelligence", "epistemic-engineering",
    "monte-carlo", "falsification", "metacortex", "hypothesisops",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
hypo = "matverse.cli:main"

[project.urls]
Homepage = "https://github.com/MatVerse-py/matverse-organism"
Issues = "https://github.com/MatVerse-py/matverse-organism/issues"
Documentation = "https://github.com/MatVerse-py/matverse-organism/blob/main/SKILL.md"
Changelog = "https://github.com/MatVerse-py/matverse-organism/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["matverse"]
include-package-data = true

[tool.setuptools.package-data]
matverse = ["py.typed"]
