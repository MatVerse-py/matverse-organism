<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatVerse Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>MatVerse Organism State</h1>
        <div id="organism-state">
            <p>Tick: <span id="tick">-</span></p>
            <p>Psi (ψ): <span id="psi">-</span></p>
            <p>Cells: <span id="cells">-</span></p>
        </div>
        <button id="procreate-button">Procreate Cell</button>
        <div id="cell-list">
            <h2>Live Cells</h2>
            <ul id="cells-data"></ul>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
